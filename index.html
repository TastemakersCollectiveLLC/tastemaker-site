<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FoodEstablishment",
  "@id": "https://www.tastemakerscollective.us/#organization",
  "name": "Tastemakers Collective",
  "legalName": "Tastemakers Collective LLC",
  "url": "https://www.tastemakerscollective.us",
  "email": "hello@tastemakerscollective.us",
  "telephone": "+1-279-271-1170",
  "description": "A Los Angeles catering and events company offering wedding and event catering, festival vending, and drop-off catering.",
  "areaServed": {
    "@type": "City",
    "name": "Los Angeles"
  },
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Los Angeles",
    "addressRegion": "CA",
    "addressCountry": "US"
  },
  "servesCuisine": [
    "Contemporary American",
    "Seasonal",
    "Fine Dining"
  ],
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Services",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Wedding catering",
          "description": "Custom menus and full service for weddings. Plated, family style, buffet or stations."
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Event catering",
          "description": "Catering for corporate events, private parties and celebrations."
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Festival vending",
          "description": "Food vending, staff meals and artist hospitality at festivals and large events."
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Drop-off catering",
          "description": "Drop-off catering for offices and gatherings."
        }
      }
    ]
  }
}
</script>
