<!DOCTYPE html>
<!-- Template for /card. build/build.js fills the double-brace tokens from CONFIG and writes card/index.html; edit here, not there. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#231F20">

<title>Tastemakers Collective | Contact</title>
<meta name="description" content="Tastemakers Collective is a Los Angeles catering and events company. Call, text, or email us, start an event inquiry, or save our contact details.">

<!-- Same interim mark as the main site. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Same two self-hosted faces as the main site. -->
<link rel="preload" href="/fonts/playfair-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>

<style>
  /* Self-hosted, swap so text is never invisible while a font loads. */
  @font-face {
    font-family: 'Playfair Display';
    font-style: normal; font-weight: 400 500; font-display: swap;
    src: url('/fonts/playfair-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Montserrat';
    font-style: normal; font-weight: 200 400; font-display: swap;
    src: url('/fonts/montserrat-latin.woff2') format('woff2');
  }

  :root {
    /* Same ground system as the main site, in the same family. This page is
       short, so the gradient is sized to the page rather than to a long
       scroll: html carries the flat base, which stops body's background
       propagating to the canvas, and body then paints the ramp inside its
       own box. Its own middle stop, so /card reads as part of the set
       without being any one of the other pages. */
    --ground-0: #0C0A0D;
    --ground-1: #1C1626;
    --ground-mid: #231C37;
    --ground-3: #0C0A0D;
    --black: #231F20;
    --amethyst: #684385;       /* frames, borders, fills, rules. 2.12:1, never text */
    --amethyst-text: #A67FC9;  /* accent text. 5.05:1 on the card black */
    --white: #FFFFFF;
    --grey: #706E6E;
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* The flat base lives on html. Without it body's background propagates
     to the canvas and the gradient stretches over the whole viewport
     instead of sitting inside the page. */
  html { -webkit-text-size-adjust: 100%; background: var(--ground-0); }

  body {
    background:
      linear-gradient(to bottom,
        var(--ground-0) 0%,
        var(--ground-1) 35%,
        var(--ground-mid) 70%,
        var(--ground-3) 100%);
    color: var(--white);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding:
      calc(16px + env(safe-area-inset-top, 0px))
      calc(16px + env(safe-area-inset-right, 0px))
      calc(16px + env(safe-area-inset-bottom, 0px))
      calc(16px + env(safe-area-inset-left, 0px));
  }

  /* Grain, between the ground and the content. Fixed to the viewport,
     inert to the pointer, inline SVG so it costs no request. It does not
     animate, so reduced motion leaves it alone. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27g%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.8%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27160%27%20height%3D%27160%27%20filter%3D%27url%28%23g%29%27%2F%3E%3C%2Fsvg%3E");
  }

  .frame {
    /* Lifted above the grain. */
    position: relative;
    z-index: 1;
    border: 1px solid var(--amethyst);
    padding: 44px 22px 40px;
    max-width: 520px;
    margin: 0 auto;
    min-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* === WORDMARK === */
  .lockup { width: 100%; text-align: center; }

  .wordmark {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(24px, 7.7vw, 44px);
    line-height: 1;
    color: var(--amethyst-text);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    white-space: nowrap;
  }

  .sub-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
  }
  .rule {
    flex: 1;
    height: 1px;
    background: var(--grey);
  }
  .sub-word {
    font-family: var(--sans);
    font-weight: 400;
    font-size: clamp(12px, 3.6vw, 16px);
    color: var(--amethyst-text);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    white-space: nowrap;
  }

  .tagline {
    margin-top: 30px;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--white);
    text-align: center;
  }

  /* === ACTIONS === */
  .actions {
    width: 100%;
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 16px 20px;
    border: 1px solid var(--amethyst);
    color: var(--white);
    background: transparent;
    font-family: var(--sans);
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.26em;
    text-indent: 0.26em;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
    transition: background-color 0.2s, color 0.2s;
  }
  .btn:hover { background: var(--amethyst); color: var(--white); }
  .btn:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 3px;
  }
  .btn.filled {
    background: var(--amethyst);
    color: var(--white);
  }
  .btn.filled:hover { background: transparent; }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--grey);
    margin: 28px 0;
  }

  .save-row { width: 100%; }

  @media (min-width: 480px) {
    .frame { padding: 60px 40px 54px; }
    .tagline { font-size: 15px; }
  }
</style>
</head>
<body>

<main class="frame">

  <div class="lockup">
    <div class="wordmark">TASTEMAKERS</div>
    <div class="sub-row">
      <span class="rule"></span>
      <span class="sub-word">COLLECTIVE</span>
      <span class="rule"></span>
    </div>
    <p class="tagline">{{tagline}}</p>
  </div>

  <nav class="actions" aria-label="Contact">
    <a class="btn" href="{{phoneHref}}">Call</a>
    <a class="btn" href="{{smsHref}}">Text</a>
    <a class="btn" href="mailto:{{email}}">Email</a>
    <a class="btn filled" href="/contact">Start an inquiry</a>
    <a class="btn" href="/">Visit the website</a>
  </nav>

  <div class="divider"></div>

  <div class="save-row">
    <a class="btn" href="/card/tastemakers.vcf" download="tastemakers.vcf">Save contact</a>
  </div>

</main>

{{scripts}}
</body>
</html>
